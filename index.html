<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guru Merdeka — Masuk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232D5016'/><text x='50' y='68' font-family='Georgia' font-size='42' font-weight='bold' fill='white' text-anchor='middle'>GM</text></svg>" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-top">
      <!-- Ornament SVG -->
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin:0 auto 16px;display:block;">
        <circle cx="22" cy="22" r="21" stroke="#C4A882" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
        <path d="M22 8 L26 16 L35 16 L28 21 L31 30 L22 25 L13 30 L16 21 L9 16 L18 16 Z" fill="#2D5016" opacity="0.15"/>
        <text x="22" y="27" font-family="Georgia" font-size="13" font-weight="700" fill="#2D5016" text-anchor="middle" dominant-baseline="middle">GM</text>
      </svg>
      <div class="login-logo-icon" style="display:none;">GM</div>
      <h1 class="login-title">Guru Merdeka</h1>
      <p class="login-subtitle">Panduan Berkarya &amp; Berpenghasilan<br/>di Era Digital</p>
    </div>

    <form id="loginForm" novalidate>
      <label class="form-label" for="pwInput">Kode Akses</label>
      <input
        type="password"
        id="pwInput"
        class="form-input"
        placeholder="Masukkan kode akses kamu"
        autocomplete="current-password"
        autofocus
        required
      />
      <p class="form-hint">Masukkan kode akses yang kamu terima setelah pembelian.</p>
      <button type="submit" class="btn-login">Masuk ke Kelas</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <p class="login-footer-note">
      Ada masalah dengan kode aksesmu?<br/>
      Hubungi kami melalui WhatsApp yang tertera di email pembelian.
    </p>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/app.js"></script>
<script>initLogin();</script>
</body>
</html>
